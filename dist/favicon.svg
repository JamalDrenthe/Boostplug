<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <!-- Background Gradient: Deep Obsidian to Cosmic Slate -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c111d"/>
      <stop offset="50%" stop-color="#070b12"/>
      <stop offset="100%" stop-color="#030508"/>
    </linearGradient>

    <!-- Border Gradient: Neon Green to Cyber Blue glow -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22c55e" stop-opacity="0.8"/>
      <stop offset="40%" stop-color="#1e293b" stop-opacity="0.25"/>
      <stop offset="70%" stop-color="#0ea5e9" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#00d2ff" stop-opacity="0.8"/>
    </linearGradient>

    <!-- Brand Core: Vibrant Neon Green to Cyber Cyan -->
    <linearGradient id="brandGrad" x1="10%" y1="10%" x2="90%" y2="90%">
      <stop offset="0%" stop-color="#22c55e"/>
      <stop offset="45%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#00d2ff"/>
    </linearGradient>

    <!-- Left Pin Gradient (Green) -->
    <linearGradient id="pinGreen" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4ade80"/>
      <stop offset="100%" stop-color="#22c55e"/>
    </linearGradient>

    <!-- Right Pin Gradient (Cyan) -->
    <linearGradient id="pinBlue" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#00d2ff"/>
    </linearGradient>

    <!-- Ambient Center Glow -->
    <radialGradient id="ambientGlow" cx="50%" cy="55%" r="50%">
      <stop offset="0%" stop-color="#22c55e" stop-opacity="0.25"/>
      <stop offset="60%" stop-color="#00d2ff" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <!-- Bolt Filter Glow -->
    <filter id="boltGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Base App Icon / Squircle -->
  <rect x="4" y="4" width="120" height="120" rx="28" fill="url(#bgGrad)"/>
  <rect x="4.5" y="4.5" width="119" height="119" rx="27.5" fill="none" stroke="url(#borderGrad)" stroke-width="1.8"/>
  
  <!-- Subtle Ambient Glow -->
  <circle cx="64" cy="66" r="46" fill="url(#ambientGlow)"/>

  <!-- Hardware Plug Pins (Left = Green, Right = Blue) -->
  <rect x="44" y="18" width="13" height="20" rx="4.5" fill="url(#pinGreen)"/>
  <rect x="71" y="18" width="13" height="20" rx="4.5" fill="url(#pinBlue)"/>

  <!-- Hardware Plug Body / Collar with micro-bevel -->
  <rect x="33" y="32" width="62" height="16" rx="6" fill="#111827" stroke="url(#borderGrad)" stroke-width="1.2"/>

  <!-- Signature Dual Core Nodes (Brand DNA from Header) -->
  <circle cx="50.5" cy="40" r="3.5" fill="#22c55e"/>
  <circle cx="77.5" cy="40" r="3.5" fill="#00d2ff"/>

  <!-- Boost Lightning Bolt (High-Voltage Surge) -->
  <path d="M75 46 L43 74 H63 L47 110 L87 64 H67 L79 46 Z" 
        fill="url(#brandGrad)" 
        filter="url(#boltGlow)"/>
</svg>